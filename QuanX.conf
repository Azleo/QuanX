server=119.29.29.29
;server=119.28.28.28
;server=[2402:4e00::]
;server=[2402:4e00:1::]

# 阿里 DNS (Alidns)
server=223.5.5.5
;server=223.6.6.6
;server=[2400:3200::1]
;server=[2400:3200:baba::1]

# 百度 DNS
;server=180.76.76.76

# 字节跳动 TrafficRoute DNS
;server=180.184.1.1
;server=180.184.2.2

# Google Public DNS
;server=8.8.8.8
;server=8.8.4.4
;server=[2001:4860:4860::8888]
;server=[2001:4860:4860::8844]

# Cloudflare DNS
;server=1.1.1.1
;server=1.0.0.1
;server=[2606:4700:4700::1111]
;server=[2606:4700:4700::1001]

# 本地 DNS 映射
# 指定域名解析DNS，支持excluded_ssids/included_ssids
# 不允许在此为域名直接设置127.0.0.1
# 如果您希望某个域名（例如：example.com）为127.0.0.1，只需在 “filter_local” 部分添加 “host, example.com, reject” 即可。拒绝操作将返回 127.0.0.0.1 的 DNS 响应
;address=/example5.com/192.168.16.18
;address=/example6.com/[2001:8d3:8d3:8d3:8d3:8d3:8d3:8d3]
;server=/*.icloud.com/system
