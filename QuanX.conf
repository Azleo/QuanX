# server=/*.tencent.com/119.29.29.29
# server=/*.weixin.com/119.29.29.29
server=/dl.google.com/119.29.29.29
server=/dl.l.google.com/119.29.29.29
server=/update.googleapis.com/119.29.29.29
;server=/example0.com/system
;server=/example1.com/8.8.4.4
;server=/*.example2.com/223.5.5.5
;server=/example4.com/[2001:4860:4860::8888]:53
;address=/example5.com/192.168.16.18
;address=/example6.com/[2001:8d3:8d3:8d3:8d3:8d3:8d3:8d3]

# 使用 DoQ(DNS over QUIC) / DoH(DNS over HTTPS)
# 当DoQ或DoH被设置时，系统和所有其他普通的（没有与之相关的特定域）服务器将被忽略
# 优先顺序：DoQ > DoH > 其他DNS
# 当设置了多个 DoQ 或 DoH 服务器时，仅第一个会被使用
# 多个（并发查询）DoQ或DoH服务器需要配置在同一行中，URL用逗号分隔
# 当DoH和DoQ服务都被设置时，查询将同时发送到所有服务器

# DoQ 配置
# 如指定了 DoQ 服务，则 DoH 以及其它 DNS 解析均失效
;doq-server=quic://dns1.example.com, quic://dns2.example.com
;doq-server=quic://dns.adguard.com, excluded_ssids=SSID1
;doq-server=quic://dns.adguard.com, included_ssids=SSID2
# DoQ的默认端口是853，如情况允许，可以设置为其他端口
;quic://dns.example.com:456

# DoH 配置
# 当使用的 DoH 服务器不是基于 HTTP/2 时，DoH 将被暂时禁用，并使用常规服务器，直到下次启动 VPN 连接
# 不建议在与防火墙相关的网络环境中使用，不确定 DoH 服务器是否总能被到达。
# 如果 DoH 服务器在您的国家或地区不是流行的 DNS 服务器，则不推荐使用，它可能会丢失 ISP DNS 服务器返回的 CDN 优化结果。
# 如果 DoH 服务器是一个反广告相关的服务器，则不推荐使用（Quantumult X 过滤模块对于被拒绝的域具有更好的性能，它可以避免客户端无休止的请求）
doh-server=https://doh.pub/dns-query, https://dns.alidns.com/dns-query

# 腾讯DoH
;doh-server=https://doh.pub/dns-query
;doh-server=https://1.12.12.12/dns-query
;doh-server=https://120.53.53.53/dns-query

# 阿里DoH
;doh-server=https://dns.alidns.com/dns-query
;doh-server=https://223.5.5.5/dns-query, https://223.6.6.6/dns-query
;doh-server=https://223.6.6.6/dns-query, excluded_ssids=SSID1
;doh-server=https://223.5.5.5/dns-query, included_ssids=SSID2

# Google DoH
;doh-server=https://dns.google/dns-query
# 👇只针对IPv6
;doh-server=https://dns64.dns.google/dns-query

# Cloudflare DNS
;doh-server=https://cloudflare-dns.com/dns-query
;doh-server=https://1.1.1.1/dns-query
;doh-server=https://1.0.0.1/dns-query


# 使用 DNS over HTTP/3
# 当设置prefer-doh3时，DoH查询将尝试通过HTTP3进行DNS，如果失败则查询连接将回退到HTTP2。 由于 HTTP/2 和 HTTP/3 连接支持多路复用，因此当您更改此设置时，它可能不会立即生效，但您可以重新连接 Quantumult X Tunnel 或手动更改网络环境以使其立即生效
prefer-doh3

# 支持 alias 映射
# 映射域名到其它域名
;alias=/example7.com/another-example.com

# circumvent-ipv4-answer和circumvent-ipv6-answer参数
# 当并发向多个上游 DNS 进行查询时，如响应最快的上游 DNS 抢答的结果命中了该条目，则 Quantumult X Tunnel DNS 模块会等待其他 DNS 服务器的响应结果（如抢答的结果中至少有一个不属于该条目，则不会等待其他 DNS 的响应，此时有效结果采用不属于该条目的所有记录）
# 如所有上游 DNS 返回的所有结果均命中该条目，则判定为 DNS 查询失败
# 如配置的上游 DNS 包含有去广告功能的 DNS 服务器，请勿使用该参数
# ？和 * 可用于规避-ipv4-answer 和规避-ipv6-answer。
circumvent-ipv4-answer=127.0.0.1, 0.0.0.0
;circumvent-ipv6-answer=::
;circumvent-ipv4-answer = 127.0.0.1, 0.0.0.0, 61.160.148.90, 182.43.124.6, 124.236.16.201, 39.102.194.95, 106.74.25.198, 36.135.17.248, 36.135.82.110, 39.105.1.17, 39.130.181.72, 39.130.181.73, 39.173.74.185, 47.92.198.202, 111.22.226.1, 111.28.0.32, 111.31.192.110, 111.44.246.131, 111.56.127.216, 111.63.132.170, 112.15.232.43, 112.17.14.211, 112.54.50.50, 117.156.25.11, 117.187.6.14, 117.187.10.42, 120.202.17.103, 120.204.204.201, 120.209.204.204, 120.222.19.204, 121.4.135.105,183.203.36.19, 183.203.36.36, 183.207.72.18, 183.213.92.2, 183.220.145.129, 183.252.183.9, 211.137.54.227, 211.137.117.149, 211.137.133.69, 211.138.218.190, 211.139.25.61, 211.139.145.129, 218.201.25.129, 218.201.25.130, 218.203.122.98, 221.130.39.3, 221.180.160.221
circumvent-ipv6-answer = ::

[policy]

# img-url参数用于指定策略组图标，可远程，也可本地/iCloud (Quantumult X/Images路径下) （108*108 大小），img-url=http://example.com/icon.png

# 类型：静态(static)
# 指向您手动选择的候选服务器。
;static=policy-name-1, Sample-A, Sample-B, Sample-C, img-url=http://example.com/icon.png

# 类型：可用(available)
# 指向列表中第一个可用服务器(当策略被触发且策略结果不可用时，将立即启动并发url延迟测试。
# 如果当时没有网络请求接受策略，这意味着策略处于空闲状态，即使服务器关闭，测试也不会启动。那时，您可以通过手动启动测试来更新服务器状态，但是这没有任何意义)。
;available=policy-name-2, Sample-A, Sample-B, Sample-C

# 类型：负载均衡(round-robin)
# 指向在候选服务器中指向下一个服务器以进行下一次连接。
# 按列表顺序轮流使用其中的服务器
;round-robin=policy-name-3, Sample-A, Sample-B, Sample-C

# 类型：随机负载均衡(Dest-Hash)
# 相同域名走固定节点，此策略对于需要会话持久性的用例特别有用
;dest-hash=DestHash, ProxyA, ProxyB, ProxyC

# 类型：延迟测试(url-latency-benchmark)
# 指向具有最佳 URL 延迟(公差，单位毫秒)结果的服务器。
# check-interval(检查间隔)单位为秒，当此策略已经被任何请求激活时考虑该间隔。
# alive-checking参数，无使用情况下亦进行检测切换。
# tolerance为容忍度参数，默认值为100（单位为毫秒）当新测试的最佳策略比原选中策略的延迟差大于容忍度时，才会切换至新的策略。
# 手动启动 URL 测试时，策略结果也会被更新。
;url-latency-benchmark=policy-name-9, resource-tag-regex=^sample, server-tag-regex=^example, check-interval=600, alive-checking=false, tolerance=0

# SSID
# 根据网络环境自动切换节点/策略组。
;ssid=policy-name-4, Sample-A, Sample-B, LINK_22E171:Sample-B, LINK_22E172:Sample-C
;ssid=<策略名称>, <蜂窝数据下默认策略>, <Wi-Fi 下默认策略>, <SSID 名称: 策略>

# 筛选（正则表达式）
# server-tag-regex 以及 resource-tag-regex 参数用于正则筛选来建立策略组，仅适用于 static、available 和 round-robin 类型的策略。
# 教程部分: https://shrtm.nu/DAFP

# 范例

# 所有节点列表
# server-tag-regex=.*

# 香港
# server-tag-regex=(?=.*(港|HK|(?i)Hong))^((?!(台湾|日本|新加坡|美国|韩国|狮城|南朝鲜|US|SG|JP|KR|TW|台灣|美國|韓國|獅城)).)*$

# 台湾
# server-tag-regex=(?=.*(台|TW|(?i)Taiwan))^((?!(香港|日本|新加坡|美国|韩国|狮城|南朝鲜|US|SG|JP|KR|HK|美國|韓國|獅城)).)*$

# 日本
