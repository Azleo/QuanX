# steam 登录服务器
host-suffix, steamserver.net, 🇨🇳国内

# 本地分流规则

# 如开启其他设置中的  “分流匹配优化” 选项，则匹配优先级如下：
# host > host-suffix > host-wildcard > host-keyword > user-agent > ip-cidr > ip6-cidr > geoip > ip-asn

# 本地规则优先生效
# <规则类型>, <内容条件>, <策略>, [参数]

;host-suffix, googleapis.com, proxy, force-cellular
# force-cellular：强制分流走蜂窝网络，当处于 Wi-Fi 网络时仍使用蜂窝网络数据
;host-suffix, googleapis.com, proxy, multi-interface
# multi-interface：当处于 Wi-Fi网络时，同时使用 Wi-Fi 网络与蜂窝网络建立 TCP 连接，使用拥有最佳 TCP 握手值的连接来传输数据
;host-suffix, googleapis.com, proxy, multi-interface-balance
# multi-interface-balance：当处于 Wi-Fi 网络时，均衡使用 Wi-Fi 网络与蜂窝网络，以提升并发任务的出口贷款
;host-suffix, googleapis.com, proxy, via-interface=pdp_ip0
# via-interface：指定分流走特定网络接口

# 完整域名匹配
;host, www.google.com, proxy
;host, www.baidu.com, reject

# 域名后缀匹配
;host-suffix, googleapis.com, proxy
;host-suffix, ads.example.com, reject
;host-suffix, cn, direct

# 域名通配符匹配
;host-wildcard, *.goo?le.com, proxy
;host-wildcard, ad*.example.com, reject

# 域名关键词匹配
;host-keyword, adservice, reject

# User-Agent 匹配
# 在 iOS 15 系统后，系统出于隐私保护考虑，不再于 CONNECT 请求中提供 User-Agent，这意味着对于所有 HTTPS 请求，在未开启 MITM 时，User-Agent 均不可见且规则无法生效
;user-agent, ?abc*, proxy
;user-agent, TIM*, direct

# IP地址匹配
;ip-cidr, 10.0.0.0/8, direct
;ip-cidr, 8.8.8.8/32, direct
;ip6-cidr, 2001:4860:4860::8888/64, direct

# Local Area Network 局域网
host-suffix, local, direct
ip-cidr, 10.0.0.0/8, direct
ip-cidr, 100.64.0.0/10, direct
ip-cidr, 127.0.0.0/8, direct
ip-cidr, 172.16.0.0/12, direct
ip-cidr, 192.168.0.0/16, direct
ip-cidr, 224.0.0.0/4, direct
ip-cidr, 183.232.159.0/24, direct
ip6-cidr, fe80::/10, direct

# geoip库
geoip, cn, direct
;geoip, netflix, proxy
# 需 GEO-IP 库支持）
;geoip, cn, direct, force-cellular
;ip-asn, 6185, proxy
;ip-asn, 13335, direct

# 你可以添加以下host-keyword规则，以跳过所有未匹配主机的 DNS 查询，纯 IP 请求不会被主机相关规则匹配。
;host-keyword, ., proxy

# 可修改对应策略组或节点
# 未命中远程&本地规则的剩余请求，将走final指定的节点/策略。
# final为必需规则，不可删除！
# final为必需规则，不可删除！
final, 🐟兜底
# final为必需规则，不可删除！
# final为必需规则，不可删除！

[rewrite_local]

# 本地复写规则

# 完整示例请查看
# https://github.com/crossutility/Quantumult-X/blob/master/sample.conf

^https?:\/\/(www.)?(g|google)\.cn url 302 https://www.google.com

[task_local]

# 包含3种类型: cron 定时任务，UI交互脚本，网络切换脚本

# 脚本应保存在本地「我的 iPhone - Quantumult X - Scripts」或「iCloud Drive - Quantumult X - Scripts」中。
# 示例：https://github.com/crossutility/Quantumult-X/blob/master/sample-task.js

# 支持 5 或 6 个 cron 字段，不包括命令字段。
# 包含3种类型: cron 定时任务、UI交互脚本、网络切换脚本

;* * * * * sample-task.js

[http_backend]

# > Boxjs设置，改为使用http backend方式，访问地址改为http://127.0.0.1:9999，更新配置后请长按风车-更新，然后重启代理
# > BoxJs相关教程参考「https://docs.boxjs.app」

;https://raw.githubusercontent.com/chavyleung/scripts/master/chavy.box.js, host=boxjs.com, tag=BoxJS, path=^/, enabled=false

[mitm]

# 证书&主机名

#
# 只有 “hostname” 中的TLS SNI或目标地址会被MitM处理。
#

# 在APP中生成证书并安装&信任，确保按提示操作！
# 默认情况下，当为 HTTPS 请求启用 MitM 时，Quantumult X 会从原站点获取证书（证书会被缓存），保留大部分需要的原始证书信息，并使用 MitM 的 root CA 重新签名，这是推荐的（也是比较兼容的）MitM 证书创建方式。

skip_validating_cert=true
force_sni_domain_name=false

# hostname 为主机名，用,分隔多个
hostname = *.google.cn, *.google.com.hk
#
# passphrase和p12需要保密！
#
# passphrase和p12需要保密！
#
# passphrase和p12需要保密！
#

;passphrase=
;p12=
